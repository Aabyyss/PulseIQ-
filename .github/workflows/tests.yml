name: Test suite

# Runs every gate on every push and pull request: the backend suite, the
# frontend typecheck/tests/build, the UI audit against a real signed-in app, and
# the end-to-end journey against a built bundle and a live API. `gate` is the
# single check branch protection should require.
#
# Coverage notes:
# - `pytest backend` runs the collected suite: clinical direction cases, the
#   published scores pinned against their sources, de-identification, the local
#   stores, the login limiter, the FHIR bundle, the live medication screen.
# - The script checks below are the older, password-free runners:
#   backend/test_orchestrator.py carries the clinical assertions (symptom text
#   → expected risk band) and its siblings are smoke checks that fail the job
#   when the code raises (broken imports, missing model, bad data).
# - The frontend job runs the vitest suite for the logic no other check
#   reaches (extraction patterns, session/retry behaviour, PDF layout).
# - The e2e job walks the journey a clinician takes — sign in, capture a line,
#   save, PDF, thank-you, history — against `vite preview` and a running API,
#   so a broken save path fails a push instead of waiting for someone to click
#   through it by hand.
# - The dataset job is the one job that needs egress on purpose: it rebuilds
#   data/heart.csv from the licensed UCI source and fails if the committed
#   bytes, provenance record or attribution notice have drifted.
# - The ui-audit job sweeps contrast in both themes and opens the screens a
#   route cannot show on first paint (account menu, both consult tabs).
# - The spaCy model install is best-effort: when unavailable the symptom
#   agent falls back to its dictionary matcher and the suite still runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pipeline
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19; move
    # deliberately once the audit/test toolchain is verified against it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cardio-ai-system
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cardio-ai-system/requirements.txt

      # `-c requirements.lock.txt` pins the closure run #33 resolved, so a new
      # release cannot change the suite between two identical commits. The floors
      # in requirements*.txt still describe what the app needs.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements.lock.txt

      - name: Install spaCy model (best effort)
        run: |
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl \
            || echo "::warning::spaCy model unavailable; tests will run on the dictionary fallback"

      # The whole pytest suite first — it covers far more than the script
      # checks below (score tables against their sources, de-identification,
      # the stores, the limiter, the FHIR bundle, the live medication screen),
      # and running it here is the only way a regression in one of those areas
      # is caught before merge.
      # `tee` leaves the failure on disk for the artifact below; `pipefail` keeps
      # pytest's exit status, which a bare pipe would quietly replace with tee's.
      - name: Run pytest suite
        run: |
          set -o pipefail
          python -m pytest backend -q 2>&1 | tee pytest-backend.log

      # A red run is read from this artifact when the hosted log is not
      # reachable. `if: always()` so the failing run is the one that uploads it.
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-pytest-log
          path: cardio-ai-system/pytest-backend.log
          if-no-files-found: ignore

      - name: Run backend script checks
        run: |
          set -e
          failed=0
          for test in test_orchestrator test_nlp_agent test_negation test_feature_mapper test_prediction_agent test_explainability_agent test_full_pipeline test_auth; do
            echo "::group::$test"
            python "backend/$test.py" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  frontend:
    name: Frontend typecheck, tests & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cardio-ai-system/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardio-ai-system/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # Logic no other check reaches: extraction patterns, session/retry
      # behaviour and PDF layout (vitest, jsdom).
      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  ui-audit:
    name: UI contrast & layout audit
    runs-on: ubuntu-24.04
    # This job now installs the backend, builds the bundle, starts a server and
    # walks 108 page loads. Bounded so a wedged sweep or a server that never
    # binds burns 25 minutes instead of the six-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # The audit signs in, and the app it audits is behind an API — so this
      # job installs and starts the backend instead of sweeping the login page.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cardio-ai-system/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardio-ai-system/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: cardio-ai-system
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Install frontend dependencies
        working-directory: cardio-ai-system/frontend
        run: npm ci

      # Signed out, every protected route redirects to /login, so the sweep
      # audits one form nine times over: green, and blind to the workspace.
      # vite preview forwards /api to :8000 (vite.config.ts), so the API this
      # job starts is the one the built app talks to. Wait on /health rather
      # than on the port: uvicorn binds before the pipeline is warm.
      - name: Start backend
        working-directory: cardio-ai-system
        run: |
          python -m uvicorn backend.api_server:app --host 127.0.0.1 --port 8000 \
            > backend-audit.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health > /dev/null; then
              echo "backend answered /health after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not answer /health within 60s"
          tail -50 backend-audit.log
          exit 1

      # Builds the production bundle, serves it with vite preview, then sweeps
      # every route at multiple viewports: WCAG AA contrast of every text node
      # against its real rendered background, horizontal overflow, clipped
      # text, and undersized tap targets. It runs from the project root so the
      # preview it starts serves the same bundle, and --require-sign-in turns an
      # unreachable backend or a dropped session into a failure instead of a
      # public-pages pass.
      - name: Run UI audit
        working-directory: cardio-ai-system
        run: |
          curl --fail --silent http://127.0.0.1:8000/health > /dev/null \
            || { echo "::error::backend stopped before the audit"; tail -50 backend-audit.log; exit 1; }
          node scripts/ui-audit.cjs --require-sign-in

      # The report records the sign-in state and every page's landing URL, so a
      # failure says which route it was. The server log comes along because a
      # backend that refused to start is the other half of that answer.
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit-report
          path: |
            cardio-ai-system/scripts/ui-audit-report.json
            cardio-ai-system/backend-audit.log
          if-no-files-found: ignore

  e2e:
    name: End-to-end journey
    runs-on: ubuntu-24.04
    # Builds the bundle, starts both servers and walks login → save → history.
    # Bounded like the audit: a journey that waits forever on a page that never
    # arrives should not burn the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cardio-ai-system/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardio-ai-system/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: cardio-ai-system
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Install frontend dependencies
        working-directory: cardio-ai-system/frontend
        run: npm ci

      # The journey walks the same bundle the audit does, not a dev server: a
      # save path that only works under Vite's dev transform is not the app.
      - name: Build the bundle
        working-directory: cardio-ai-system/frontend
        run: npm run build

      - name: Start backend
        working-directory: cardio-ai-system
        run: |
          python -m uvicorn backend.api_server:app --host 127.0.0.1 --port 8000 \
            > backend-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health > /dev/null; then
              echo "backend answered /health after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not answer /health within 60s"
          tail -50 backend-e2e.log
          exit 1

      # `vite preview` forwards /api and /ws to :8000 (preview.proxy in
      # vite.config.ts), which is what lets the journey use the WebSocket
      # concept stream and the REST save path against one origin.
      - name: Start preview server
        working-directory: cardio-ai-system/frontend
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort \
            > preview-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ > /dev/null; then
              echo "preview answered after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::preview did not answer within 60s"
          cat preview-e2e.log
          exit 1

      # playwright-core drives an existing browser rather than downloading one.
      # The ubuntu-24.04 image ships Chrome; naming the binary here keeps a
      # future image change a clear "no browser" failure, not a locator timeout.
      - name: Find the browser
        run: |
          if ! command -v google-chrome > /dev/null; then
            echo "::error::no Chrome on this runner — the journey needs a Chromium binary"
            exit 1
          fi
          google-chrome --version

      - name: Run the journey
        working-directory: cardio-ai-system
        run: |
          curl --fail --silent http://127.0.0.1:8000/health > /dev/null \
            || { echo "::error::backend stopped before the journey"; tail -50 backend-e2e.log; exit 1; }
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null \
            || { echo "::error::preview stopped before the journey"; cat frontend/preview-e2e.log; exit 1; }
          node scripts/e2e-save-visit.cjs --base-url http://127.0.0.1:4173

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs
          path: |
            cardio-ai-system/backend-e2e.log
            cardio-ai-system/frontend/preview-e2e.log
          if-no-files-found: ignore

  sources:
    name: Catalogue sources
    runs-on: ubuntu-24.04
    # Cheap and network-free: every drug and every interaction rule must cite an
    # id in SOURCES, and every registered source must be cited. The live URL
    # check is `make verify-sources NETWORK=1` — it needs egress, and a publisher
    # blocking a runner is not a reason to fail a push.
    defaults:
      run:
        working-directory: cardio-ai-system
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cardio-ai-system/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Every citation resolves to a registered source
        run: python scripts/verify_sources.py

  dataset:
    name: Dataset provenance
    runs-on: ubuntu-24.04
    # Compares the committed dataset with a fresh build from UCI (CC BY 4.0):
    # every value, the provenance record and the attribution notice. Standard
    # library only, so it installs nothing — and it fails closed when the
    # committed file, its hashes or the notice no longer match the source.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cardio-ai-system
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A hit means this job touches no network: the archive is read from disk
      # and its member file is still verified against the pinned SHA-256. The
      # key is the pin itself, so there is deliberately no `restore-keys` —
      # restoring an archive from a different source revision would defeat the
      # check. A miss downloads once; the post-job step saves the archive.
      - name: Restore the pinned UCI archive
        uses: actions/cache@v5
        with:
          path: ~/.cache/pulseiq/uci-heart-disease.zip
          key: uci-heart-disease-b17cd273da9ce1caa4710fce80227ea454d4dbf9fcbc8e6a9121672751563adc

      - name: Rebuild from UCI and compare with the committed files
        run: >-
          python scripts/import_uci_heart.py --check
          --archive ~/.cache/pulseiq/uci-heart-disease.zip

  gate:
    name: Gate
    # One check to require in branch protection: it is red unless every job
    # above is green. `always()` makes a failed dependency a failure here rather
    # than a skipped job that looks benign in the checks list.
    needs: [backend, frontend, ui-audit, e2e, sources, dataset]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job passed
        run: |
          results="${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.ui-audit.result }} ${{ needs.e2e.result }} ${{ needs.sources.result }} ${{ needs.dataset.result }}"
          echo "job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not pass ($results)"
              exit 1
            fi
          done
          echo "all required jobs passed"
