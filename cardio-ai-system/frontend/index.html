<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12071F" />
    <script>
      (function(){try{var t=localStorage.getItem("pulseiq.theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}document.documentElement.classList.toggle("dark",t==="dark");}catch(e){document.documentElement.classList.add("dark");}})();
    </script>
    <meta
      name="description"
      content="PulseIQ — cardiac screening, live consultation capture and structured reporting for clinician teams."
    />
    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PulseIQ" />
    <meta property="og:title" content="PulseIQ · Cardiac Screening &amp; Consultation Workspace" />
    <meta
      property="og:description"
      content="Cardiac screening, live consultation capture and structured reporting — running entirely on your device."
    />
    <meta property="og:url" content="http://localhost:5173/" />
    <meta property="og:image" content="http://localhost:5173/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PulseIQ — cardiac screening workspace" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PulseIQ · Cardiac Screening &amp; Consultation Workspace" />
    <meta
      name="twitter:description"
      content="Cardiac screening, live consultation capture and structured reporting — running entirely on your device."
    />
    <meta name="twitter:image" content="http://localhost:5173/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
    />
    <title>PulseIQ · Cardiac Screening &amp; Consultation Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 40px; color: #ebedf0; background: #0b0c0f">
        <h1 style="font-size: 18px">PulseIQ needs JavaScript</h1>
        <p style="color: #98a0aa">
          This workspace runs entirely in your browser. Enable JavaScript and reload to continue.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
